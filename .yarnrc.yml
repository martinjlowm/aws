enableScripts: true

enableTelemetry: false

nodeLinker: node-modules

# Shares the unpacked packages with every other yarn-berry repo on this machine
# (~/.yarn/berry/index), which is most of the point of leaving bun's installer:
# the CDK and AWS SDK trees are the same ones mj-agents pulls.
nmMode: hardlinks-global

npmMinimalAgeGate: 0
