<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Dubplate">
  <!--
    A record and the groove a needle sits in.

    Two colours and no palette. A favicon is drawn at sixteen pixels against a
    browser chrome this page does not choose, so it takes the reader's system
    theme rather than the site's: ink on nothing in light, paper on nothing in
    dark. The background stays transparent, which is what lets it sit on either.

    `prefers-color-scheme` inside an SVG works because the file is a document in
    its own right. It is not styled by the page that links it, and it does not
    follow the in-page theme.
  -->
  <style>
    :root { --mark: #1c1525; }
    @media (prefers-color-scheme: dark) { :root { --mark: #fbf8f2; } }
  </style>
  <g fill="none" stroke="var(--mark)" stroke-width="8" stroke-linecap="butt">
    <circle cx="50" cy="50" r="42" />
    <circle cx="50" cy="50" r="24" />
  </g>
  <circle cx="50" cy="50" r="6" fill="var(--mark)" />
</svg>
